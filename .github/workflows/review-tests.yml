name: Verified review tests
on:
  push:
    branches: [feature/verified-product-reviews]
  pull_request:
    branches: [main]
jobs:
  review-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
