name: Cart origin regression checks
on:
  pull_request:
    branches:
      - codex/mockup-homepage
  push:
    branches:
      - fix/render-cart-origin-review
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
